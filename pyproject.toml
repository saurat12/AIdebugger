[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidebugger"
version = "0.1.0"
description = "Repository-wide failure detection and AI debugging context capture"
requires-python = ">=3.12"
dependencies = ["keyring>=25", "openai>=1.100.0"]

[project.scripts]
aidebug = "aidebug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-temp"
